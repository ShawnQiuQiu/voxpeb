[project]
name = "voxpeb-toefl-coach"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "websockets",
    "pyaudio",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
 